name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: local
        type: choice
        options:
          - local
          - staging
          - production

jobs:
  test:
    name: Run Playwright Tests (${{ github.event.inputs.environment || 'local' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ENV: ${{ github.event.inputs.environment || 'local' }}
      BASE_URL_LOCAL: ${{ secrets.BASE_URL_LOCAL || 'https://opensource-demo.orangehrmlive.com' }}
      BASE_URL_STAGING: ${{ secrets.BASE_URL_STAGING }}
      BASE_URL_PRODUCTION: ${{ secrets.BASE_URL_PRODUCTION }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'Admin' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD || 'admin123' }}
      DEFAULT_TIMEOUT: 45000
      EXPECT_TIMEOUT: 8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7
